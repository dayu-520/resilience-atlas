[project]
name = "research-asset-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "bcrypt>=4.1",
  "boto3>=1.34",
  "email-validator>=2.1",
  "fastapi>=0.111",
  "geoalchemy2>=0.14",
  "passlib[bcrypt]>=1.7",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "rq>=1.16",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.29"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
