[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-atlas-api"
version = "1.0.0"
description = "Team geospatial data hub for the Resilience Atlas platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "geoalchemy2>=0.17,<1",
  "pydantic-settings>=2.10,<3",
  "python-jose[cryptography]>=3.5,<4",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.39,<2",
  "geopandas>=1.1,<2",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "rio-cogeo>=5.4,<6",
  "orjson>=3.11,<4",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
ignore = ["B008"]  # FastAPI dependency declarations intentionally call Depends/File/Form.
