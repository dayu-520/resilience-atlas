services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resilience_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilience} -d ${POSTGRES_DB:-resilience_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-resilience}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-resilience-dev}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD:-resilience-dev}@postgres:5432/${POSTGRES_DB:-resilience_atlas}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-resilience}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-resilience-dev}
      S3_BUCKET: datasets
      RASTER_PREVIEW_MAX_DIMENSION: ${RASTER_PREVIEW_MAX_DIMENSION:-2048}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080"]'
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:

